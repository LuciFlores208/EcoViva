<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca</title>

    <link rel="stylesheet" href="pBiblioteca.css">
</head>
<body>
    <header class="header">
        <h4>Logo</h4>
        <nav>
            <a href="../Home/index.html">Início</a>
            <a href="../pag.mapa/pMapa.html">Mapa</a>
            <a href="../pag.jogos/pJogos.html">Jogos</a>
            <a href="../pag.biblioteca/pBiblioteca.html">Biblioteca</a>
            <a href="../pag.IA/frontend/index.html">Capy</a>
        </nav>
    </header>
    <section class="biblioteca">
        <div class="texto-topo">
            <p>
                “Quanto mais você ler, mais coisas você saberá.
                Quanto mais você aprender, mais lugares você irá.”
                — Dr. Seuss
            </p>
        </div>
        <div class="area-filtros">
            <div class="filtros">
                <h4>Buscar por Tipo</h4>
                <div class="grupo-botoes">
                    <button 
                    class="ativo"
                    data-tipo="Todos"
                    onclick="filtrarTipo('Todos')">
                        Todos
                    </button>
                    <button 
                    data-tipo="Artigo"
                    onclick="filtrarTipo('Artigo')">
                        Artigos
                    </button>
                    <button 
                    data-tipo="Livro"
                    onclick="filtrarTipo('Livro')">
                        Livros
                    </button>
                    <button 
                    data-tipo="Noticia"
                    onclick="filtrarTipo('Noticia')">
                        Notícias
                    </button>
                    <button 
                    data-tipo="Tutorial"
                    onclick="filtrarTipo('Tutorial')">
                        Tutoriais
                    </button>
                </div>
            </div>
            <div class="filtros">
                <h4>Status</h4>
                <div class="grupo-botoes">
                    <button
            class="ativo"
            data-status="Todos"
            onclick="filtrarStatus('Todos')">
            Tudo
        </button>

        <button
            data-status="Lido"
            onclick="filtrarStatus('Lido')">
            Lido
        </button>

        <button
            data-status="Lendo"
            onclick="filtrarStatus('Lendo')">
            Lendo
        </button>

        <button
            data-status="Quero ler"
            onclick="filtrarStatus('Quero ler')">
            Quero ler
        </button>
                </div>
            </div>
        </div>
        <div class="busca">
            <input
                type="text"
                id="busca"
                placeholder="Buscar por título...">
        </div>
        <div id="cards"></div>
    </section>
    <footer class="footer">
        <h2>Logo</h2>
    </footer>
    <script src="pBiblioteca.js"></script>
</body>
</html>
